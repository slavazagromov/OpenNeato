name: Publish OpenNeato HA 1.24.0-nogo.6

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-ha-nogo6-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and HACS release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.24.0-nogo.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "OpenNeato HA 1.24.0-nogo.6" \
              --notes "Home Assistant/HACS release adding no-go shape editing in the OpenNeato replay card: Line, Box, Circle, and Move/resize tools. Shapes are converted to the existing no-go line format; robot firmware/protocol is unchanged."
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "OpenNeato HA 1.24.0-nogo.6" \
              --notes "Home Assistant/HACS release adding no-go shape editing in the OpenNeato replay card: Line, Box, Circle, and Move/resize tools. Shapes are converted to the existing no-go line format; robot firmware/protocol is unchanged."
          fi
